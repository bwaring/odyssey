<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Odyssey: Odysseus's ship under sail on the wine-dark sea -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#0d1119"/>
    </linearGradient>
  </defs>

  <!-- rounded-square app background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- guiding star -->
  <g fill="#e0b341">
    <path d="M398 96 l9 26 26 9 -26 9 -9 26 -9-26 -26-9 26-9 z"/>
  </g>

  <!-- mast + square sail (cream, billowing) -->
  <rect x="251" y="150" width="10" height="190" rx="5" fill="#cdb89a"/>
  <path d="M150 168 q106 -34 212 0 q-26 78 0 150 q-106 34 -212 0 q26 -78 0 -150 z"
        fill="#f1ead9"/>
  <path d="M256 158 v200" stroke="#d8cbb2" stroke-width="4" opacity="0.6"/>

  <!-- ship hull (gold) -->
  <path d="M118 348 h276 q-22 70 -94 78 h-88 q-72 -8 -94 -78 z" fill="#e0b341"/>
  <path d="M118 348 h276 l-14 22 h-248 z" fill="#caa033"/>
  <!-- prow curl -->
  <path d="M394 348 q40 -6 44 -42 q-30 8 -34 42 z" fill="#e0b341"/>

  <!-- wine-dark sea -->
  <g stroke="#2e6f8e" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M70 432 q34 -22 68 0 q34 22 68 0 q34 -22 68 0 q34 22 68 0 q34 -22 60 0"/>
    <path d="M86 466 q34 -22 68 0 q34 22 68 0 q34 -22 68 0 q34 22 68 0" opacity="0.55"/>
  </g>
</svg>
